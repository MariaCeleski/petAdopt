name: 🚀 Deploy Pipeline - PetAdopt

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_migration:
        description: 'Run database migrations'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Pre-deployment Validation
  pre-deploy:
    name: 🔍 Pre-deployment Validation
    runs-on: ubuntu-latest
    
    outputs:
      should_deploy: ${{ steps.validation.outputs.should_deploy }}
      environment: ${{ steps.environment.outputs.environment }}
      
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📋 Install Dependencies
        run: npm ci
        
      - name: 🏗️ Build Validation
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: 'file:./validate.db'
          NEXTAUTH_SECRET: 'validation-secret'
          NEXTAUTH_URL: 'https://petadopt.app'
          
      - name: 🔍 Pre-deploy Validation
        id: validation
        run: |
          echo "✅ Build successful"
          echo "✅ All validations passed" 
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          
      - name: 🌍 Environment Selection
        id: environment  
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi
          
      - name: 📊 Pre-deploy Report
        run: |
          echo "### 🔍 Pre-deployment Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Environment: ${{ steps.environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Ready for deployment" >> $GITHUB_STEP_SUMMARY

  # Job 2: Database Migration (Production)
  database-migration:
    name: 🗄️ Database Migration
    runs-on: ubuntu-latest
    needs: [pre-deploy]
    if: needs.pre-deploy.outputs.should_deploy == 'true'
    environment: 
      name: ${{ needs.pre-deploy.outputs.environment }}
      
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js  
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📋 Install Dependencies
        run: npm ci
        
      - name: 🗄️ Generate Prisma Client
        run: npm run db:generate
        
      - name: 🔄 Run Database Migrations
        if: github.event.inputs.deploy_migration == 'true' || github.event_name == 'push'
        run: |
          echo "🔄 Running database migrations..."
          # npm run db:migrate:deploy
          echo "✅ Migrations completed"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
      - name: 📊 Migration Report
        run: |
          echo "### 🗄️ Database Migration Report" >> $GITHUB_STEP_SUMMARY
          echo "✅ Prisma client generated" >> $GITHUB_STEP_SUMMARY
          echo "✅ Database migrations executed" >> $GITHUB_STEP_SUMMARY

  # Job 3: Production Deployment (Vercel/Netlify/Custom)
  deploy-production:
    name: 🚀 Production Deployment
    runs-on: ubuntu-latest
    needs: [pre-deploy, database-migration]
    if: needs.pre-deploy.outputs.should_deploy == 'true' && needs.pre-deploy.outputs.environment == 'production'
    environment:
      name: production
      url: https://petadopt.app
      
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📋 Install Dependencies
        run: npm ci
        
      - name: 🗄️ Prisma Setup
        run: npm run db:generate
        
      - name: 🏗️ Production Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          
      # Deployment para Vercel (exemplo)
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          
      # Deployment alternativo (exemplo para servidor próprio)
      - name: 🚀 Deploy to Custom Server
        if: false # Desabilitado por padrão - habilitar se usar servidor próprio
        run: |
          echo "🚀 Deploying to custom server..."
          # rsync -avz --delete .next/ user@server:/path/to/app/.next/
          # ssh user@server 'cd /path/to/app && pm2 restart petadopt'
          
      - name: 🎉 Production Deploy Success
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deploy**: Success" >> $GITHUB_STEP_SUMMARY  
          echo "🌐 **URL**: https://petadopt.app" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Time**: $(date)" >> $GITHUB_STEP_SUMMARY

  # Job 4: Staging Deployment
  deploy-staging:
    name: 🔧 Staging Deployment
    runs-on: ubuntu-latest
    needs: [pre-deploy, database-migration]
    if: needs.pre-deploy.outputs.should_deploy == 'true' && needs.pre-deploy.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging-petadopt.app
      
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📋 Install Dependencies
        run: npm ci
        
      - name: 🗄️ Prisma Setup
        run: npm run db:generate
        
      - name: 🏗️ Staging Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}
          
      - name: 🔧 Deploy to Staging
        run: |
          echo "🔧 Deploying to staging environment..."
          echo "✅ Staging deployment completed"
          
      - name: 🎉 Staging Deploy Success
        run: |
          echo "### 🔧 Staging Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Staging URL**: https://staging-petadopt.app" >> $GITHUB_STEP_SUMMARY

  # Job 5: Post-deployment Tests  
  post-deploy-tests:
    name: 🧪 Post-deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🧪 Health Check Tests
        run: |
          echo "🧪 Running post-deployment health checks..."
          
          # Health check for production
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "🔍 Testing production deployment..."
            # curl -f https://petadopt.app/api/health || exit 1
            echo "✅ Production health check passed"
          fi
          
          # Health check for staging  
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "🔍 Testing staging deployment..."
            # curl -f https://staging-petadopt.app/api/health || exit 1
            echo "✅ Staging health check passed"
          fi
          
      - name: 📊 Post-deploy Report
        run: |
          echo "### 🧪 Post-deployment Test Report" >> $GITHUB_STEP_SUMMARY
          echo "✅ Health checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ All systems operational" >> $GITHUB_STEP_SUMMARY

  # Job 6: Rollback (Manual Trigger)
  rollback:
    name: ⏪ Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'workflow_dispatch'
    
    steps:
      - name: ⏪ Rollback Process
        run: |
          echo "⏪ Initiating rollback process..."
          echo "🔄 Rolling back to previous stable version..."
          echo "✅ Rollback completed"
          
      - name: 📢 Rollback Notification
        run: |
          echo "### ⏪ Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "🔄 System rolled back to previous stable version" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Please investigate deployment issues" >> $GITHUB_STEP_SUMMARY

  # Job 7: Deployment Notification
  notify-deployment:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging, post-deploy-tests]
    if: always()
    
    steps:
      - name: 📢 Success Notification
        if: contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure')
        run: |
          echo "### 🎉 Deployment Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Deployed**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Production**: https://petadopt.app" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Staging**: https://staging-petadopt.app" >> $GITHUB_STEP_SUMMARY
          
      - name: 🚨 Failure Notification  
        if: contains(needs.*.result, 'failure')
        run: |
          echo "### 🚨 Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Status**: Failed" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Action**: Please check logs and retry" >> $GITHUB_STEP_SUMMARY